<!-- @dsCard group="Type" viewport="700x190" name="Display Headline" subtitle="Geist Bold upright + Instrument Serif italic accent phrase" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--white); color: var(--text-strong); padding: 28px 32px; }
  h1 { margin: 0; font-size: 46px; font-weight: 700; line-height: 1.06; letter-spacing: -0.035em; }
  .accent { font-family: var(--font-display); font-style: italic; font-weight: 400; background: linear-gradient(135deg, var(--brand) 0%, var(--brand-deep) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .meta { margin-top: 16px; font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }
</style>
</head>
<body>
  <h1>Commercial subs stop<br><span class="accent">losing money to scope creep</span></h1>
  <div class="meta">Geist 700 · −0.035em · Instrument Serif italic on the orange gradient phrase</div>
</body>
</html>
