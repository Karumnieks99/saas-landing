<!-- @dsCard group="Brand" viewport="700x180" name="Logo & Wordmark" subtitle="Orange-on-ink monogram tile + Scope/Bolt wordmark, light & dark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); display: flex; }
  .pane { flex: 1; padding: 28px 32px; display: flex; flex-direction: column; gap: 18px; justify-content: center; }
  .light { background: var(--white); }
  .dark { background: var(--zinc-950); }
  .row { display: flex; align-items: center; gap: 14px; }
  img { display: block; }
  .lbl { font-family: var(--font-mono); font-size: 10px; }
  .light .lbl { color: var(--text-faint); }
  .dark .lbl { color: var(--zinc-500); }
</style>
</head>
<body>
  <div class="pane light">
    <div class="row"><img src="../assets/logo-mark.svg" width="48" height="48" alt="mark"><img src="../assets/wordmark.svg" height="40" alt="ScopeBolt"></div>
    <span class="lbl">on light · mark + wordmark</span>
  </div>
  <div class="pane dark">
    <div class="row"><img src="../assets/logo-mark-dark.svg" width="48" height="48" alt="mark"><img src="../assets/wordmark-on-dark.svg" height="40" alt="ScopeBolt"></div>
    <span class="lbl">on ink · reversed</span>
  </div>
</body>
</html>
