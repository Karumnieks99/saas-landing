<!-- @dsCard group="Colors" viewport="700x150" name="Dark Surfaces" subtitle="Near-black zinc panels for Features & CTA — orange pops against them" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--white); padding: 20px; }
  .panel { background: var(--surface-dark); border-radius: 16px; padding: 22px 24px; display: flex; align-items: center; gap: 22px; }
  .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-on-dark); }
  h3 { margin: 6px 0 0; font-family: var(--font-display); font-style: italic; font-size: 26px; font-weight: 400; color: #fff; letter-spacing: -0.02em; }
  .meta { color: var(--zinc-400); font-size: 12px; margin-top: 4px; }
  .chips { display: flex; gap: 8px; margin-left: auto; }
  .c { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border-dark); display: flex; align-items: flex-end; justify-content: flex-start; padding: 4px; font-size: 9px; font-family: var(--font-mono); color: rgba(255,255,255,.6); }
</style>
</head>
<body>
  <div class="panel">
    <div>
      <div class="eyebrow">Features</div>
      <h3>Built for the field</h3>
      <div class="meta">zinc-950 ground · orange-400 accent · white-10% hairlines</div>
    </div>
    <div class="chips">
      <div class="c" style="background:var(--zinc-900)">900</div>
      <div class="c" style="background:var(--zinc-950)">950</div>
      <div class="c" style="background:var(--brand);color:#fff">brand</div>
    </div>
  </div>
</body>
</html>
