<!-- @dsCard group="Type" viewport="700x150" name="Eyebrows & Metrics" subtitle="Uppercase tracked pill labels + tabular stat counters" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--white); color: var(--text-strong); padding: 24px 32px; display: flex; align-items: center; gap: 40px; }
  .pills { display: flex; flex-direction: column; gap: 12px; }
  .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .pill { display: inline-flex; width: fit-content; border-radius: 999px; padding: 6px 12px; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .orange { border: 1px solid var(--orange-200); background: var(--orange-50); color: var(--orange-600); }
  .stats { display: flex; gap: 32px; margin-left: auto; }
  .stat b { display: block; font-size: 32px; font-weight: 700; letter-spacing: -0.03em; }
  .stat span { font-size: 13px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="pills">
    <span class="pill orange">How it works</span>
    <span class="eyebrow" style="color:var(--text-faint)">LIVE PORTFOLIO · 0.14em tracking</span>
  </div>
  <div class="stats">
    <div class="stat"><b>$4,200</b><span>avg recovered / job</span></div>
    <div class="stat"><b>340+</b><span>subs active</span></div>
    <div class="stat"><b>98%</b><span>retention</span></div>
  </div>
</body>
</html>
