<!-- @dsCard group="Spacing" viewport="700x170" name="Shadows & Elevation" subtitle="Soft low-contrast cards; the primary button gets an orange-tinted lift" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--zinc-50); padding: 28px; display: flex; gap: 24px; align-items: center; }
  .box { flex: 1; height: 80px; background: #fff; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); border: 1px solid var(--border); }
  .btn { flex: 1; height: 52px; border-radius: 12px; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; box-shadow: var(--shadow-brand); }
</style>
</head>
<body>
  <div class="box" style="box-shadow:var(--shadow-sm)">sm</div>
  <div class="box" style="box-shadow:var(--shadow-card)">card</div>
  <div class="box" style="box-shadow:var(--shadow-lg)">lg</div>
  <div class="btn">brand lift</div>
</body>
</html>
