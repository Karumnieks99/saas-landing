<!-- @dsCard group="Colors" viewport="700x150" name="Brand Orange" subtitle="The one ScopeBolt accent — wordmark, primary actions, alerts" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--white); color: var(--text-strong); }
  .wrap { display: flex; gap: 0; padding: 20px; }
  .sw { flex: 1; height: 96px; border-radius: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 10px; box-sizing: border-box; }
  .sw:first-child { border-radius: 12px 0 0 12px; }
  .sw:last-child { border-radius: 0 12px 12px 0; }
  .sw b { font-size: 11px; font-weight: 600; }
  .sw span { font-size: 10px; opacity: 0.85; font-family: var(--font-mono); }
  .lt { color: #fff; }
  .dk { color: var(--zinc-900); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw dk" style="background: var(--orange-50)"><b>50</b><span>#fff3ed</span></div>
    <div class="sw dk" style="background: var(--orange-200)"><b>200</b><span>#fed7aa</span></div>
    <div class="sw lt" style="background: var(--orange-400)"><b>400</b><span>#fb923c</span></div>
    <div class="sw lt" style="background: var(--orange-600)"><b>600</b><span>#ea580c</span></div>
    <div class="sw lt" style="background: var(--brand); outline: 2px solid var(--brand); outline-offset: -2px;"><b>brand</b><span>#e8440a</span></div>
    <div class="sw lt" style="background: var(--brand-deep)"><b>deep</b><span>#c23000</span></div>
  </div>
</body>
</html>
