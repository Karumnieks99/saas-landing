<!-- @dsCard group="Spacing" viewport="700x130" name="Radius Scale" subtitle="Generous & rounded — pills for actions, 16–24px for cards" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--white); padding: 24px; display: flex; gap: 20px; align-items: flex-end; }
  .item { text-align: center; }
  .box { width: 84px; height: 64px; background: var(--zinc-100); border: 1.5px solid var(--zinc-300); }
  .lbl { margin-top: 8px; font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
  .lbl b { display: block; color: var(--text-strong); font-size: 11px; }
</style>
</head>
<body>
  <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lbl"><b>sm</b>8px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lbl"><b>md</b>12px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lbl"><b>lg</b>16px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lbl"><b>xl</b>24px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-pill); width:64px"></div><div class="lbl"><b>pill</b>999px</div></div>
</body>
</html>
