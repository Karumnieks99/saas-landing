<!-- @dsCard group="Colors" viewport="700x150" name="Neutral Ramp (Zinc)" subtitle="Text, surfaces & borders — warm-grey zinc from paper to near-black" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--white); color: var(--text-strong); }
  .wrap { display: flex; gap: 0; padding: 20px; }
  .sw { flex: 1; height: 96px; display: flex; flex-direction: column; justify-content: flex-end; padding: 7px 8px; box-sizing: border-box; border: 1px solid rgba(0,0,0,0.04); }
  .sw:first-child { border-radius: 12px 0 0 12px; }
  .sw:last-child { border-radius: 0 12px 12px 0; }
  .sw b { font-size: 11px; font-weight: 600; }
  .lt { color: #fff; }
  .dk { color: var(--zinc-700); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw dk" style="background: var(--zinc-50)"><b>50</b></div>
    <div class="sw dk" style="background: var(--zinc-100)"><b>100</b></div>
    <div class="sw dk" style="background: var(--zinc-200)"><b>200</b></div>
    <div class="sw dk" style="background: var(--zinc-300)"><b>300</b></div>
    <div class="sw dk" style="background: var(--zinc-400)"><b>400</b></div>
    <div class="sw lt" style="background: var(--zinc-500)"><b>500</b></div>
    <div class="sw lt" style="background: var(--zinc-600)"><b>600</b></div>
    <div class="sw lt" style="background: var(--zinc-700)"><b>700</b></div>
    <div class="sw lt" style="background: var(--zinc-800)"><b>800</b></div>
    <div class="sw lt" style="background: var(--zinc-900)"><b>900</b></div>
    <div class="sw lt" style="background: var(--zinc-950)"><b>950</b></div>
  </div>
</body>
</html>
