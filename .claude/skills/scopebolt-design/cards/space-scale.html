<!-- @dsCard group="Spacing" viewport="700x140" name="Spacing Scale" subtitle="4px base — the rhythm behind padding, gaps & stacks" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--white); padding: 22px 28px; }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .item { text-align: center; }
  .bar { background: var(--brand); border-radius: 3px; width: 100%; }
  .b1 { height: 4px; } .b2 { height: 8px; } .b3 { height: 12px; } .b4 { height: 16px; }
  .b6 { height: 24px; } .b8 { height: 32px; } .b12 { height: 48px; } .b16 { height: 64px; }
  .cell { width: 56px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  .lbl { margin-top: 7px; font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
  .lbl b { color: var(--text-strong); }
</style>
</head>
<body>
  <div class="row">
    <div class="cell"><div class="bar b1"></div><div class="lbl"><b>1</b> 4</div></div>
    <div class="cell"><div class="bar b2"></div><div class="lbl"><b>2</b> 8</div></div>
    <div class="cell"><div class="bar b3"></div><div class="lbl"><b>3</b> 12</div></div>
    <div class="cell"><div class="bar b4"></div><div class="lbl"><b>4</b> 16</div></div>
    <div class="cell"><div class="bar b6"></div><div class="lbl"><b>6</b> 24</div></div>
    <div class="cell"><div class="bar b8"></div><div class="lbl"><b>8</b> 32</div></div>
    <div class="cell"><div class="bar b12"></div><div class="lbl"><b>12</b> 48</div></div>
    <div class="cell"><div class="bar b16"></div><div class="lbl"><b>16</b> 64</div></div>
  </div>
</body>
</html>
